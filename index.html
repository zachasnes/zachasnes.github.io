<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zach Asnes · AI in the real world</title>
  <meta name="description" content="The best free AI course for your job, plus stories from real enterprise AI rollouts. By Zach Asnes.">
  <meta property="og:title" content="Zach Asnes · AI in the real world">
  <meta property="og:description" content="The best free AI course for your job, plus stories from real enterprise AI rollouts.">
  <meta property="og:image" content="https://zachasnes.com/assets/og.png">
  <meta property="og:url" content="https://zachasnes.com/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
</head>

<body>
  <nav class="site-nav">
    <a href="index.html" class="nav-logo">Zach Asnes</a>
    <ul class="nav-links">
      <li><a href="trainings.html">Trainings</a></li>
      <li><a href="stories.html">Stories</a></li>
    </ul>
  </nav>

  <section class="page-top">
    <div class="big-text">FREE AI TRAINING<br><span>FOR YOUR JOB.</span></div>

    <div class="picker" role="group" aria-label="Choose your role and industry">
      I'm in
      <label class="token"><span class="visually-hidden">Role</span><select id="role"></select></label>
      in
      <label class="token"><span class="visually-hidden">Industry</span><select id="industry"></select></label><span class="picker-end">.</span>
    </div>

    <p class="status" id="t-status" aria-live="polite">Loading courses…</p>
    <div id="t-results"></div>
    <a class="btn ghost see-all" id="see-all" href="trainings.html">See all free trainings →</a>
  </section>

  <section id="stories">
    <div class="section-label">Stories from real AI rollouts</div>
    <div id="s-list"></div>
    <a class="btn ghost see-all" id="all-stories" href="stories.html" hidden>All stories →</a>
  </section>

  <footer>
    <p><a href="https://www.linkedin.com/in/zachary-asnes/" target="_blank" rel="noopener">Zach Asnes on LinkedIn ↗</a></p>
    <p>Views are my own and don't represent Google.</p>
  </footer>

  <script src="assets/site.js"></script>
  <script src="assets/trainings.js"></script>
  <script src="assets/stories.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const state = { role: "", industry: "" };
      let courses = [];

      function update() {
        if (!courses.length) return;
        $("t-status").textContent = TRAININGS.render($("t-results"), courses, state, { limit: 3 });
        const p = new URLSearchParams();
        if (state.role) p.set("role", state.role);
        if (state.industry) p.set("industry", state.industry);
        $("see-all").href = "trainings.html" + (p.toString() ? "?" + p : "");
      }

      TRAININGS.initPicker($("role"), $("industry"), state, update);

      SITE.loadTrainings()
        .then((c) => { courses = c; $("t-status").textContent = ""; update(); })
        .catch((err) => SITE.showError($("t-status"), "the course list", err));

      SITE.loadStories()
        .then((stories) => {
          $("s-list").replaceChildren(stories.length ? STORIES.grid(stories.slice(0, 3), "stories.html") : STORIES.empty());
          $("all-stories").hidden = stories.length <= 3;
        })
        .catch((err) => {
          console.warn("[zachasnes] stories unavailable:", err);
          $("s-list").replaceChildren(STORIES.empty());
        });
    })();
  </script>
</body>

</html>
