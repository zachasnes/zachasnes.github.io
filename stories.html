<body>
  <nav class="site-nav">

    </ul>
  </nav>

  <section class="page-top" id="list-view">
    <div class="big-text">AI IN THE<br><span>REAL WORLD.</span></div>
    <p class="lede">What actually happens when big companies roll out AI, and the free training to do it yourself.</p>

    <p class="status" id="status" aria-live="polite">Loading stories…</p>
    <div id="list"></div>
  </section>

  <section class="page-top" id="reader-view" hidden></section>

  <footer>
    <p><a href="https://www.linkedin.com/in/zachary-asnes/" target="_blank" rel="noopener">Zach Asnes on LinkedIn ↗</a></p>
    <p>Views are my own and don't represent Google. Customers are kept anonymous.</p>
  </footer>

  <script src="assets/site.js"></script>
  <script src="assets/stories.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const statusEl = $("status"), list = $("list"), listView = $("list-view"), readerView = $("reader-view");
      let stories = [];

      function renderList() {
        list.replaceChildren(stories.length ? STORIES.grid(stories, "stories.html") : STORIES.empty());
      }

      function route() {
        const key = decodeURIComponent(location.hash.slice(1));
        const story = key && stories.find((s) => s.slug === key);
        listView.hidden = !!story;
        readerView.hidden = !story;
        if (story) {
          readerView.replaceChildren(STORIES.reader(story));
          document.title = story.title + " · Zach Asnes";
          window.scrollTo(0, 0);
        } else {
          document.title = "Stories · Zach Asnes";
          renderList();
        }
      }

      window.addEventListener("hashchange", route);

      SITE.loadStories()
        .then((s) => { stories = s; statusEl.textContent = ""; route(); })
        .catch((err) => SITE.showError(statusEl, "stories", err));
    })();
  </script>
</body>

</html>
