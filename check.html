  <section class="page-top">
    <div class="big-text">AI-aware<br><span>or AI-fluent?</span></div>
    <p class="lede">Check everything that's true for you today. One minute, nothing is saved.</p>

    <fieldset class="check" id="check">
      <legend class="visually-hidden">Statements that are true for you</legend>
      <label><input type="checkbox"> I use an AI assistant for work at least once a week.</label>
      <label><input type="checkbox"> I can name a task in my job that AI does faster than I do.</label>
      <label><input type="checkbox"> I give AI context (who it's for, the goal, the format) instead of one-line questions.</label>
      <label><input type="checkbox"> I check AI output for errors before I use it.</label>
      <label><input type="checkbox"> I know which company data I'm allowed to put into AI tools.</label>
      <label><input type="checkbox"> I've saved a prompt or assistant that I reuse for a repeat task.</label>
      <label><input type="checkbox"> I've changed a whole workflow, not just one task, because of AI.</label>
      <label><input type="checkbox"> I've helped a teammate get better at using AI.</label>
    </fieldset>

    <button type="button" class="btn" id="check-go">See my level</button>
    <div id="check-result" aria-live="polite"></div>
  </section>
